# Netlify configuration for the LKA invoice app.
# The app lives at the repository root, so leave "Base directory" empty in Netlify.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The Firebase *web* config is public by design (it is compiled into the
  # browser bundle), so exclude those keys from Netlify's secrets scanning.
  # FIREBASE_PROJECT_ID has the same value as VITE_FIREBASE_PROJECT_ID.
  # Real secrets (FIREBASE_PRIVATE_KEY, SETUP_CODE) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_APP_ID,FIREBASE_PROJECT_ID"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # firebase-admin is shipped as a regular node_module instead of being
  # bundled by esbuild (it relies on dynamic requires).
  external_node_modules = ["firebase-admin"]

# Local development: `npx netlify-cli dev` serves Vite + functions on :8888
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# Single-page app: every unknown path serves index.html (functions are
# matched first because they live under /.netlify/functions/).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
